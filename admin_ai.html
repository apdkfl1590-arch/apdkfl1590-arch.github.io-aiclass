<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELD-AI | 관리자 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        welding: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            amber: '#f59e0b',
                            cyan: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(51, 65, 85, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen bg-grid-pattern flex flex-col">

    <header class="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg text-white font-bold glow-cyan">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white tracking-wide flex items-center gap-2">
                        WELD-AI <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Admin</span>
                    </h1>
                    <p class="text-xs text-slate-400">관리자 품질 검토 및 피드백 센터</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center border border-slate-600">
                        <i class="fa-solid fa-user-tie text-cyan-400"></i>
                    </div>
                    관리자 (품질팀)
                </div>
                <button class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    로그아웃
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Sidebar: Settings -->
        <aside class="lg:col-span-1 space-y-6">
            <!-- Importance Settings Panel -->
            <div class="bg-slate-900/80 rounded-xl p-5 border border-slate-800 shadow-xl">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-cyan-400"></i> 중요도 산출 기준 설정
                </h2>
                <p class="text-[11px] text-slate-400 mb-5 leading-relaxed">
                    작업자가 전송한 파일의 <strong>중요도(우선순위)</strong>를 결정하는 가중치를 설정합니다. (1~10점)
                </p>

                <div class="space-y-5">
                    <!-- Config 1: Workplace -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-semibold text-slate-300"><i class="fa-solid fa-map-location-dot text-slate-500 mr-1"></i> 작업 장소</label>
                            <span id="valWorkplace" class="text-xs font-bold text-cyan-400">5</span>
                        </div>
                        <input type="range" id="weightWorkplace" min="0" max="10" value="5" oninput="updateRangeVal('valWorkplace', this.value)">
                    </div>
                    
                    <!-- Config 2: Work Type -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-semibold text-slate-300"><i class="fa-solid fa-fire text-slate-500 mr-1"></i> 작업 종류 (공법)</label>
                            <span id="valWorkType" class="text-xs font-bold text-cyan-400">5</span>
                        </div>
                        <input type="range" id="weightWorkType" min="0" max="10" value="5" oninput="updateRangeVal('valWorkType', this.value)">
                    </div>

                    <!-- Config 3: Delivery Date -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-semibold text-slate-300"><i class="fa-regular fa-calendar-check text-slate-500 mr-1"></i> 납기 기일 (긴급도)</label>
                            <span id="valDelivery" class="text-xs font-bold text-cyan-400">8</span>
                        </div>
                        <input type="range" id="weightDelivery" min="0" max="10" value="8" oninput="updateRangeVal('valDelivery', this.value)">
                    </div>
                </div>

                <button onclick="applyImportanceSettings()" class="mt-6 w-full py-2.5 bg-slate-800 hover:bg-cyan-600 hover:text-white text-cyan-400 border border-cyan-500/30 text-xs font-bold rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calculator"></i>
                    <span>중요도 재계산 적용</span>
                </button>
            </div>

            <!-- Summary Status -->
            <div class="bg-slate-900/80 rounded-xl p-5 border border-slate-800 shadow-xl">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">검토 대기 현황</h3>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                        <span class="block text-2xl font-bold text-white" id="totalCount">0</span>
                        <span class="text-[10px] text-slate-400 uppercase">전체 접수</span>
                    </div>
                    <div class="bg-rose-500/10 p-3 rounded-lg border border-rose-500/20">
                        <span class="block text-2xl font-bold text-rose-400" id="dangerCount">0</span>
                        <span class="text-[10px] text-slate-400 uppercase">위험(확인필요)</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right Main: File List & Sorting -->
        <section class="lg:col-span-3 flex flex-col gap-4">
            
            <!-- Toolbar: Sorting & Filtering -->
            <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800 shadow flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-amber-500 text-lg"></i>
                    <h2 class="text-sm font-bold text-white">작업자 전송 파일 목록</h2>
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <!-- Sort By -->
                    <div class="flex items-center bg-slate-950/50 rounded-lg border border-slate-700 p-1">
                        <label class="text-[10px] text-slate-400 px-2">정렬 기준</label>
                        <select id="sortBy" onchange="renderFileList()" class="bg-transparent text-xs text-white outline-none cursor-pointer pr-2">
                            <option value="time">시간순 (접수일시)</option>
                            <option value="safety">안전도순 (AI점수)</option>
                            <option value="importance">중요도순 (산출점수)</option>
                            <option value="delivery">납기기일순 (D-Day)</option>
                        </select>
                    </div>

                    <!-- Sort Order -->
                    <div class="flex items-center bg-slate-950/50 rounded-lg border border-slate-700 p-1">
                        <button id="orderDesc" onclick="setOrder('desc')" class="px-2 py-1 rounded text-xs font-bold bg-slate-700 text-white shadow">
                            <i class="fa-solid fa-arrow-down-9-1 mr-1"></i>내림차순
                        </button>
                        <button id="orderAsc" onclick="setOrder('asc')" class="px-2 py-1 rounded text-xs font-bold text-slate-400 hover:text-white transition">
                            <i class="fa-solid fa-arrow-up-1-9 mr-1"></i>오름차순
                        </button>
                    </div>
                </div>
            </div>

            <!-- File List Container (Left/Right Layout) -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 overflow-y-auto pb-10 items-start">
                <!-- Left Column: Action Required -->
                <div class="flex flex-col gap-4">
                    <h3 class="text-sm font-bold text-rose-400 border-b border-rose-500/30 pb-2 flex justify-between items-end">
                        <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> 조치 필요 (불량/주의)</span>
                        <span class="text-xs font-normal text-slate-400" id="badCountHeader">총 0건</span>
                    </h3>
                    <div id="badFilesContainer" class="flex flex-col gap-4"></div>
                </div>

                <!-- Right Column: Normal -->
                <div class="flex flex-col gap-4">
                    <h3 class="text-sm font-bold text-emerald-400 border-b border-emerald-500/30 pb-2 flex justify-between items-end">
                        <span><i class="fa-solid fa-circle-check mr-1"></i> 정상 (용접 양호)</span>
                        <span class="text-xs font-normal text-slate-400" id="goodCountHeader">총 0건</span>
                    </h3>
                    <div id="goodFilesContainer" class="flex flex-col gap-4"></div>
                </div>
            </div>

        </section>
    </main>

    <!-- Feedback Modal (Prototype) -->
    <div id="feedbackModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 rounded-xl shadow-2xl p-6 max-w-md w-full border border-slate-700 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-comment-dots text-cyan-400"></i> 작업자 피드백 전송
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div class="flex items-center gap-3 bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                    <div class="w-10 h-10 rounded bg-slate-800 flex items-center justify-center text-slate-400">
                        <i class="fa-solid fa-image"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-white" id="modalWorkerName">작업자: -</p>
                        <p class="text-[10px] text-slate-400" id="modalWorkInfo">공법: - / 장소: -</p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">문제점 및 지시사항 작성</label>
                    <textarea class="w-full h-24 bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" placeholder="시제품에서는 텍스트만 입력 가능합니다."></textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition-colors">취소</button>
                <button onclick="closeModal(); alert('피드백이 전송되었습니다. (시제품 기능)');" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-paper-plane"></i> 전송
                </button>
            </div>
        </div>
    </div>

    <script>
        // Mock Data for the prototype
        const mockFiles = [
            { id: 1, worker: "김철수", time: "2026-09-29 10:30", workplace: "A동 1라인", workType: "SMAW", deliveryDate: "2026-10-05", safetyScore: 85, daysLeft: 6, workplaceBase: 80, workTypeBase: 70 },
            { id: 2, worker: "이영희", time: "2026-09-29 11:15", workplace: "B동 2라인", workType: "GMAW", deliveryDate: "2026-10-02", safetyScore: 60, daysLeft: 3, workplaceBase: 60, workTypeBase: 80 },
            { id: 3, worker: "박지성", time: "2026-09-29 09:00", workplace: "A동 2라인", workType: "GTAW", deliveryDate: "2026-10-10", safetyScore: 95, daysLeft: 11, workplaceBase: 80, workTypeBase: 90 },
            { id: 4, worker: "최동석", time: "2026-09-28 15:45", workplace: "C동 외곽", workType: "FCAW", deliveryDate: "2026-10-01", safetyScore: 45, daysLeft: 2, workplaceBase: 40, workTypeBase: 60 },
            { id: 5, worker: "정민수", time: "2026-09-29 13:20", workplace: "B동 1라인", workType: "SMAW", deliveryDate: "2026-10-03", safetyScore: 72, daysLeft: 4, workplaceBase: 60, workTypeBase: 70 },
            { id: 6, worker: "한소희", time: "2026-09-29 14:05", workplace: "A동 3라인", workType: "SAW", deliveryDate: "2026-09-30", safetyScore: 55, daysLeft: 1, workplaceBase: 80, workTypeBase: 85 }
        ];

        let currentSortOrder = 'desc'; // desc or asc
        let filesData = [...mockFiles];

        // UI Update for sliders
        function updateRangeVal(id, value) {
            document.getElementById(id).innerText = value;
        }

        // Set sort direction
        function setOrder(order) {
            currentSortOrder = order;
            const btnDesc = document.getElementById('orderDesc');
            const btnAsc = document.getElementById('orderAsc');
            
            if(order === 'desc') {
                btnDesc.className = 'px-2 py-1 rounded text-xs font-bold bg-slate-700 text-white shadow';
                btnAsc.className = 'px-2 py-1 rounded text-xs font-bold text-slate-400 hover:text-white transition';
            } else {
                btnAsc.className = 'px-2 py-1 rounded text-xs font-bold bg-slate-700 text-white shadow';
                btnDesc.className = 'px-2 py-1 rounded text-xs font-bold text-slate-400 hover:text-white transition';
            }
            renderFileList();
        }

        // Calculate Importance based on user settings
        function calculateImportance() {
            const wPlace = parseInt(document.getElementById('weightWorkplace').value);
            const wType = parseInt(document.getElementById('weightWorkType').value);
            const wDelivery = parseInt(document.getElementById('weightDelivery').value);

            // Avoid division by zero
            const totalWeight = wPlace + wType + wDelivery || 1; 

            filesData.forEach(file => {
                // 납기가 짧을수록 점수 높음 (최대 15일 기준)
                let deliveryScore = Math.max(0, 15 - file.daysLeft) * (100/15); 
                
                // 가중치 적용
                let rawScore = (file.workplaceBase * wPlace) + (file.workTypeBase * wType) + (deliveryScore * wDelivery);
                
                // 100점 만점으로 정규화
                file.importanceScore = Math.round(rawScore / totalWeight);
            });
        }

        function applyImportanceSettings() {
            calculateImportance();
            
            // If already sorting by importance, re-render
            const sortBy = document.getElementById('sortBy').value;
            if(sortBy === 'importance') {
                renderFileList();
            } else {
                document.getElementById('sortBy').value = 'importance';
                renderFileList();
            }
            
            // Visual feedback
            const btn = document.querySelector('button[onclick="applyImportanceSettings()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>적용 완료!</span>';
            btn.classList.add('bg-cyan-600', 'text-white');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-cyan-600', 'text-white');
            }, 1500);
        }

        // Render the list
        function renderFileList() {
            const sortBy = document.getElementById('sortBy').value;
            
            // 공통 정렬 함수
            const sortFunction = (a, b) => {
                let valA, valB;
                
                if (sortBy === 'time') {
                    // String comparison for time (YYYY-MM-DD HH:MM)
                    valA = a.time;
                    valB = b.time;
                } else if (sortBy === 'safety') {
                    valA = a.safetyScore;
                    valB = b.safetyScore;
                } else if (sortBy === 'importance') {
                    valA = a.importanceScore;
                    valB = b.importanceScore;
                } else if (sortBy === 'delivery') {
                    valA = a.daysLeft;
                    valB = b.daysLeft;
                }

                if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
                return 0;
            };

            // 우선적으로 용접 상태별 분류 (안전도 80 미만: 문제/불량, 80 이상: 양호)
            const badFiles = filesData.filter(f => f.safetyScore < 80);
            const goodFiles = filesData.filter(f => f.safetyScore >= 80);

            // 각각 그룹 내에서 정렬 수행
            badFiles.sort(sortFunction);
            goodFiles.sort(sortFunction);

            // Count for dashboard summary
            document.getElementById('totalCount').innerText = filesData.length;
            document.getElementById('dangerCount').innerText = filesData.filter(f => f.safetyScore < 60).length;

            // DOM Elements for Left/Right lists
            const badContainer = document.getElementById('badFilesContainer');
            const goodContainer = document.getElementById('goodFilesContainer');
            
            // Clear current lists
            badContainer.innerHTML = '';
            goodContainer.innerHTML = '';

            // Update Headers
            document.getElementById('badCountHeader').innerText = `총 ${badFiles.length}건`;
            document.getElementById('goodCountHeader').innerText = `총 ${goodFiles.length}건`;
            
            // 카드 생성 헬퍼 함수
            const createCardHTML = (file) => {
                // Color coding for safety
                let safetyColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                let statusIcon = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                if(file.safetyScore < 60) {
                    safetyColor = 'text-rose-400 bg-rose-500/10 border-rose-500/20';
                    statusIcon = '<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>';
                } else if(file.safetyScore < 80) {
                    safetyColor = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                    statusIcon = '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>';
                }

                // Color coding for importance
                let impColor = 'text-slate-300 bg-slate-800';
                if(file.importanceScore >= 80) impColor = 'text-rose-400 bg-rose-500/20 font-bold';
                else if(file.importanceScore >= 60) impColor = 'text-amber-400 bg-amber-500/20';

                return `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col justify-between hover:border-slate-500 transition-colors">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center border border-slate-700 text-slate-400 text-xl shadow-inner">
                                    <i class="fa-solid fa-image"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-sm flex items-center gap-1.5">
                                        ${file.worker} 작업자
                                        ${statusIcon}
                                    </h4>
                                    <span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock"></i> ${file.time} 접수</span>
                                </div>
                            </div>
                            
                            <!-- Badges -->
                            <div class="flex flex-col gap-1 items-end">
                                <span class="px-2 py-0.5 rounded text-[10px] border ${safetyColor}">
                                    안전도: <strong>${file.safetyScore}점</strong>
                                </span>
                                <span class="px-2 py-0.5 rounded text-[10px] ${impColor}">
                                    중요도: <strong>${file.importanceScore}점</strong>
                                </span>
                            </div>
                        </div>

                        <!-- Meta info -->
                        <div class="grid grid-cols-3 gap-2 mb-4 bg-slate-950/50 p-2 rounded-lg border border-slate-800">
                            <div class="text-center border-r border-slate-700">
                                <span class="block text-[9px] text-slate-500 uppercase">장소</span>
                                <span class="text-xs font-semibold text-slate-300 truncate">${file.workplace}</span>
                            </div>
                            <div class="text-center border-r border-slate-700">
                                <span class="block text-[9px] text-slate-500 uppercase">공법</span>
                                <span class="text-xs font-semibold text-slate-300 truncate">${file.workType}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[9px] text-slate-500 uppercase">납기</span>
                                <span class="text-xs font-semibold text-rose-300 truncate">D-${file.daysLeft}</span>
                            </div>
                        </div>

                        <!-- Action -->
                        <button onclick="openFeedbackModal('${file.worker}', '${file.workType}', '${file.workplace}')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded border border-slate-700 transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass-chart text-cyan-400"></i> 검토 및 피드백 작성
                        </button>
                    </div>
                `;
            };

            // 불량/위험 파일 렌더링 (좌측)
            badFiles.forEach(file => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = createCardHTML(file);
                badContainer.appendChild(tempDiv.firstElementChild);
            });

            // 양호 파일 렌더링 (우측)
            goodFiles.forEach(file => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = createCardHTML(file);
                goodContainer.appendChild(tempDiv.firstElementChild);
            });
        }

        // Modal Controls
        const modal = document.getElementById('feedbackModal');
        const modalContent = document.getElementById('modalContent');
        
        function openFeedbackModal(worker, workType, workplace) {
            document.getElementById('modalWorkerName').innerText = `작업자: ${worker}`;
            document.getElementById('modalWorkInfo').innerText = `공법: ${workType} / 장소: ${workplace}`;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Initialize on load
        window.onload = () => {
            calculateImportance();
            renderFileList();
        };

    </script>
</body>
</html>
