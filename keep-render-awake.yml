name: Keep Render Awake

on:
  schedule:
    # GitHub Actions cron is UTC. Ping every 12 minutes.
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render service
        run: |
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --max-time 60 \
            https://weld-ai-inspection-k45p.onrender.com/healthz
